<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Join household — The board</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="wrap" id="root">
  <h1 class="brand">You've been invited</h1>
  <p class="muted" style="margin-bottom:20px;">Log in or create an account to join this household.</p>
  <div class="card">
    <div class="tabs" style="margin-bottom:16px;">
      <div class="tab active" id="tab-login">Log in</div>
      <div class="tab" id="tab-signup">Sign up</div>
    </div>
    <div class="stack">
      <input id="email" type="email" placeholder="name@example.com" />
      <input id="password" type="password" placeholder="Password" />
      <div id="err" class="error"></div>
      <button class="btn-primary" id="go">Join household</button>
    </div>
  </div>
</div>
<script src="/api.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get("code");
  let mode = "login";
  document.getElementById("tab-login").onclick = () => { mode = "login"; render(); };
  document.getElementById("tab-signup").onclick = () => { mode = "signup"; render(); };
  function render() {
    document.getElementById("tab-login").className = "tab" + (mode === "login" ? " active" : "");
    document.getElementById("tab-signup").className = "tab" + (mode === "signup" ? " active" : "");
    document.getElementById("go").textContent = mode === "login" ? "Log in and join" : "Sign up and join";
  }
  document.getElementById("go").onclick = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errBox = document.getElementById("err");
    errBox.textContent = "";
    try {
      await api(mode === "login" ? "/auth/login" : "/auth/signup", { method: "POST", body: { email, password } });
      await api("/households/join", { method: "POST", body: { code } });
      location.href = "/";
    } catch (e) {
      errBox.textContent = e.message;
    }
  };
</script>
</body>
</html>
