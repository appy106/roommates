<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set password — The board</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="wrap" id="root">
  <h1 class="brand" id="heading">Set your password</h1>
  <p class="muted" style="margin-bottom:20px;" id="sub">Choose a password to finish setting up your account.</p>
  <div class="card stack">
    <input id="password" type="password" placeholder="New password (min 8 characters)" />
    <input id="password2" type="password" placeholder="Confirm password" />
    <div id="err" class="error"></div>
    <button class="btn-primary" id="go">Set password</button>
  </div>
</div>
<script src="/api.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token");
  const isSetup = params.get("setup") === "1";
  if (isSetup) {
    document.getElementById("heading").textContent = "Welcome — set your password";
    document.getElementById("sub").textContent = "You've been added to a household. Choose a password to log in.";
  }
  if (!token) {
    document.getElementById("err").textContent = "This link is missing a token and won't work.";
  }
  document.getElementById("go").onclick = async () => {
    const p1 = document.getElementById("password").value;
    const p2 = document.getElementById("password2").value;
    const errBox = document.getElementById("err");
    errBox.textContent = "";
    if (p1 !== p2) { errBox.textContent = "Passwords don't match."; return; }
    try {
      await api("/auth/reset-password", { method: "POST", body: { token, password: p1 } });
      location.href = "/";
    } catch (e) {
      errBox.textContent = e.message;
    }
  };
</script>
</body>
</html>
